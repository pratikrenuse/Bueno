name: Studio render

on:
  push:
    paths:
      - "studio/content/**.json"
      - "studio/content_batch.json"
      - "studio/renderer/**"
      - "studio/photos/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render everything, even packages that already have assets"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow supabase
      - name: Render and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RERENDER: ${{ github.event.inputs.force }}
        run: python studio/render_and_upload.py
